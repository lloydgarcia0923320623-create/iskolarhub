name: iskolarhub
description: IskolarHub - Mobile Scholarship Directory and Matching App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  intl: ^0.19.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  rive: ^0.13.20
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
